apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// F-Droid builds the arm64 APK every phone wants; the release workflow passes -Pabis to fold
// the remaining architectures into the single universal APK it attaches to a GitHub release.
def abis = (findProperty('abis') ?: 'arm64-v8a').toString().split(',').toList()

android {
    namespace 'org.scrib.transcriber'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'org.scrib.transcriber'
        minSdk 26
        // minSdk 29
        targetSdk 35
        versionCode 9
        versionName '0.9'

        ndk {
            abiFilters.addAll(abis)
        }
        externalNativeBuild {
            cmake {
                cppFlags '-O3'
                //cppFlags "-I/home/roberto/Android/Vulkan-Headers/include -I/home/roberto/Android/SPIRV-Headers/include"
                //cppFlags "-I/home/roberto/Android/Vulkan-Headers/include " +
                //        "-I/home/roberto/Android/SPIRV-Headers/include " +
                //        "-DVULKAN_HPP_DISPATCH_LOADER_DYNAMIC=1"
                cFlags '-O3'
                arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                // Lets find_package() see host-installed CMake config packages (like SPIRV-Headers)
                // in addition to the Android NDK sysroot — needed by ggml-vulkan's host-side
                // shader generator tool.
                arguments '-DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH'
                arguments '-DANDROID_PLATFORM=android-29'
            }
        }
    }

    buildFeatures {
        aidl true
        compose true
    }

    externalNativeBuild {
        cmake {
            path 'src/main/jni/whisper/CMakeLists.txt'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix '.debug'
            resValue "string", "app_name", "Scrib Dev"
        }
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    // ggml builds a cpu backend for every instruction set it knows; only the two jni.c asks for
    // are worth a megabyte of apk each. The rest need instructions no phone sells with (SME), or
    // measured slower than the plain build on real hardware -- the SVE kernels are written for
    // server cores and run at about half the speed on a phone.
    packaging {
        jniLibs {
            excludes += ['**/libggml-cpu-android_armv8.2_1.so',
                         '**/libggml-cpu-android_armv8.6*.so',
                         '**/libggml-cpu-android_armv9*.so']
        }
    }

    sourceSets {
        main {
            kotlin.srcDirs += 'src/main/kotlin'
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
